name: Collect TSE data and publish Pages

on:
  push:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-and-tse-collector
  cancel-in-progress: false

jobs:
  collect-and-publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect official TSE snapshots
        id: collect
        run: node collect-tse.cjs

      - name: Save shared snapshots in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/tse
          if ! git diff --cached --quiet; then
            git commit -m "Update shared TSE snapshots"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'schedule' || steps.collect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name != 'schedule' || steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish site
        id: deployment
        if: github.event_name != 'schedule' || steps.collect.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
