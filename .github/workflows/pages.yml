name: Collect TSE data and publish Pages

on:
  push:
    # O commit automático dos snapshots não deve iniciar outra coleta em seguida.
    paths-ignore:
      - 'dist/data/tse/**'
  schedule:
    # GitHub Actions aceita agendamentos a partir de 5 minutos; execuções podem atrasar.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-and-tse-collector
  cancel-in-progress: false

jobs:
  collect-and-publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect priority national and state snapshots
        id: collect-core
        run: node collect-tse.cjs --core-only

      - name: Save priority snapshots in the repository
        if: steps.collect-core.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/tse
          if ! git diff --cached --quiet; then
            git commit -m "Update shared TSE snapshots"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Configure GitHub Pages for priority snapshots
        if: github.event_name != 'schedule' || steps.collect-core.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site with priority snapshots
        if: github.event_name != 'schedule' || steps.collect-core.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish priority snapshots
        id: deployment
        if: github.event_name != 'schedule' || steps.collect-core.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Collect municipality and exterior snapshots
        id: collect-localities
        run: node collect-tse.cjs --localities-only

      - name: Save municipality and exterior snapshots in the repository
        if: steps.collect-localities.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/tse
          if ! git diff --cached --quiet; then
            git commit -m "Update shared TSE locality snapshots"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Configure GitHub Pages for locality snapshots
        if: steps.collect-localities.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site with locality snapshots
        if: steps.collect-localities.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-localities
          path: dist

      - name: Publish locality snapshots
        if: steps.collect-localities.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-localities
