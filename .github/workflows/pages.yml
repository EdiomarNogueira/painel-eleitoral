name: Collect TSE data and publish Pages

on:
  push:
    # O commit automático dos snapshots não deve iniciar outra coleta em seguida.
    paths-ignore:
      - 'dist/data/tse/**'
  schedule:
    # GitHub Actions aceita agendamentos a partir de 5 minutos; execuções podem atrasar.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-priority-data
  cancel-in-progress: false

jobs:
  collect-and-publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect priority national and state snapshots
        id: collect-core
        run: node collect-tse.cjs --core-only

      - name: Save priority snapshots in the repository
        if: steps.collect-core.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/tse
          if ! git diff --cached --quiet; then
            git commit -m "Update shared TSE snapshots"
            for attempt in 1 2 3; do
              git fetch origin "$DEFAULT_BRANCH"
              git rebase "origin/$DEFAULT_BRANCH"
              if git push origin "HEAD:$DEFAULT_BRANCH"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push priority snapshots after three attempts." >&2
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Configure GitHub Pages for priority snapshots
        if: github.event_name != 'schedule' || steps.collect-core.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site with priority snapshots
        if: github.event_name != 'schedule' || steps.collect-core.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish priority snapshots
        id: deployment
        if: github.event_name != 'schedule' || steps.collect-core.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
