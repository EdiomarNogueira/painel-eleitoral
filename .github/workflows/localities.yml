name: Collect municipal and exterior TSE data

on:
  schedule:
    # A cada 5 minutos: apenas localidades ainda incompletas.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Serializa as duas publicações para evitar um deploy sobrescrever o outro.
  group: github-pages-priority-data
  cancel-in-progress: false

jobs:
  collect-localities:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect municipality and exterior snapshots
        id: collect
        run: node collect-tse.cjs --localities-only

      - name: Save changed locality snapshots
        if: steps.collect.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/tse
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update shared TSE locality snapshots"
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push locality snapshots after three attempts." >&2
          exit 1

      - name: Configure GitHub Pages after locality changes
        if: steps.collect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site with refreshed locality snapshots
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish refreshed locality snapshots
        id: deployment
        if: steps.collect.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
