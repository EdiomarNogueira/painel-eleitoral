name: Collect municipal and exterior TSE data

on:
  schedule:
    # Atualização independente da coleta nacional, fora do início da hora.
    - cron: '13,33,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-tse-localities
  cancel-in-progress: false

jobs:
  collect-localities:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect municipality and exterior snapshots
        id: collect
        run: node collect-tse.cjs --localities-only

      - name: Save changed locality snapshots
        if: steps.collect.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/tse
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update shared TSE locality snapshots"
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push locality snapshots after three attempts." >&2
          exit 1
